server:
  port: 8083

spring:
    datasource:
      url: jdbc:mysql://${DB_HOST:localhost}:3306/tags_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: root
      driverClassName: com.mysql.cj.jdbc.Driver
    jpa:
      hibernate:
        ddl-auto: update
    application:
      name: TAG-SERVICE

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_SERVER_ADDRESS:http://localhost:8761/eureka}
      
logging:
  level:
    org:
      springframework:
        security: DEBUG




