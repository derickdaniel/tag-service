server:
  port: 8083

spring:
    datasource:
      url: jdbc:mysql://${DB_HOST:localhost}:3306/tags_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: Donotgiveup@04
      driverClassName: com.mysql.cj.jdbc.Driver
    jpa:
      hibernate:
        ddl-auto: update
    application:
      name: TAG-SERVICE
    kafka:
      bootstrap-servers: localhost:9092

      consumer:
        group-id: tag-service-group
        auto-offset-reset: earliest
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

        properties:
          spring.json.trusted.packages: com.microservice.tags.dto
          spring.json.value.default.type: com.microservice.tags.dto.TagAssignmentDTO

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_SERVER_ADDRESS:http://localhost:8761/eureka}

logging:
  level:
    org:
      springframework:
        security: DEBUG




